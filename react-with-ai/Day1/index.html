<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
  </head>
  <body>
    <section class="fruit-transfer">
      <div class="left-basket">
        <h1><span>100</span> Apples</h1>
      </div>

      <div class="transfert-buttons">
        <button class="left-to-right" title="Transfer to Right basket">
          Transfer to Right basket
        </button>
        <button class="right-to-left" title="Transfer to Left basket">
          Transfer to Left basket
        </button>
      </div>

      <div class="right-basket">
        <h1><span>0</span> Apples</h1>
      </div>
    </section>

    <script src="react.js"></script>
  </body>
</html>
