<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Analyzer - A/B Testing Tool</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .analysis-section {
            border-left: 4px solid #667eea;
            padding-left: 16px;
            margin: 16px 0;
        }
        .missing-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin: 12px 0;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_PROVIDERS = { ANTHROPIC: 'anthropic', GEMINI: 'gemini', DEMO: 'demo' };

        function App() {
            const [activeTab, setActiveTab] = useState('settings');
            const [apiProvider, setApiProvider] = useState(API_PROVIDERS.ANTHROPIC);
            const [apiKey, setApiKey] = useState('');
            const [testRequirements, setTestRequirements] = useState('');
            const [helperFunctions, setHelperFunctions] = useState('');
            const [analysis, setAnalysis] = useState(null);
            const [generatedCode, setGeneratedCode] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // Load saved data from localStorage
            useEffect(() => {
                const savedHelpers = localStorage.getItem('helperFunctions');
                const savedProvider = localStorage.getItem('apiProvider') || API_PROVIDERS.ANTHROPIC;
                const keyStorage = savedProvider === 'gemini' ? 'geminiApiKey' : 'anthropicApiKey';
                const savedApiKey = localStorage.getItem(keyStorage) || '';
                setApiProvider(savedProvider);
                setApiKey(savedApiKey);
                if (savedHelpers) setHelperFunctions(savedHelpers);
                if (savedApiKey || savedProvider === API_PROVIDERS.DEMO) setActiveTab('input');
            }, []);

            // Save helper functions to localStorage
            const saveHelpers = () => {
                localStorage.setItem('helperFunctions', helperFunctions);
                alert('Helper functions saved successfully!');
            };

            // Save API key and provider to localStorage
            const saveApiKey = () => {
                if (apiProvider === API_PROVIDERS.DEMO) {
                    localStorage.setItem('apiProvider', API_PROVIDERS.DEMO);
                    setError('');
                    alert('Demo mode saved – no API key needed! ✅');
                    setActiveTab('input');
                    return;
                }
                if (!apiKey.trim()) {
                    setError(apiProvider === API_PROVIDERS.GEMINI ? 'Please enter your Google Gemini API key' : 'Please enter your Anthropic API key');
                    return;
                }
                if (apiProvider === API_PROVIDERS.ANTHROPIC && !apiKey.startsWith('sk-ant-')) {
                    setError('Invalid API key format. Anthropic keys start with "sk-ant-"');
                    return;
                }
                const keyStorage = apiProvider === 'gemini' ? 'geminiApiKey' : 'anthropicApiKey';
                localStorage.setItem('apiProvider', apiProvider);
                localStorage.setItem(keyStorage, apiKey);
                setError('');
                alert('Settings saved successfully! ✅');
                setActiveTab('input');
            };

            // Clear API key
            const clearApiKey = () => {
                if (confirm('Are you sure you want to remove your API key?')) {
                    setApiKey('');
                    const keyStorage = apiProvider === 'gemini' ? 'geminiApiKey' : 'anthropicApiKey';
                    localStorage.removeItem(keyStorage);
                    setActiveTab('settings');
                }
            };

            // Demo mode: build placeholder analysis from text (no API)
            const buildDemoAnalysis = () => {
                const text = testRequirements.trim();
                const lines = text.split(/\n+/).filter(Boolean).slice(0, 5);
                return {
                    goal: text.slice(0, 200) || 'Define the test goal based on requirements above.',
                    audiences: { included: ['All visitors'], excluded: ['Bot traffic'] },
                    location: { pages: lines.length ? lines : ['Specify pages'], geography: 'All', displayLogic: 'As per requirements' },
                    userBehavior: ['Click', 'View', 'Convert'],
                    tracking: { newCookies: [], goals: ['Primary goal'], variations: ['Control', 'Variant'] },
                    missingInfo: ['Audience details', 'Exact page URLs', 'Tracking events'],
                    openQuestions: ['Which pages exactly?', 'Any geo restrictions?']
                };
            };

            // Analyze test requirements (Anthropic / Gemini / Demo)
            const analyzeTest = async () => {
                const needsKey = apiProvider !== API_PROVIDERS.DEMO;
                if (needsKey && !apiKey) {
                    setError('Please add your API key in Settings, or choose "Demo (No API)"');
                    setActiveTab('settings');
                    return;
                }
                if (!testRequirements.trim()) {
                    setError('Please enter test requirements');
                    return;
                }

                setLoading(true);
                setError('');
                setAnalysis(null);

                if (apiProvider === API_PROVIDERS.DEMO) {
                    await new Promise(r => setTimeout(r, 600));
                    setAnalysis(buildDemoAnalysis());
                    setActiveTab('analysis');
                    setLoading(false);
                    return;
                }

                const prompt = `You are acting as a Frontend Experimentation Developer (Optimizely / A/B Testing).

IMPORTANT RULES:
1. Analyze the test requirement completely
2. Provide a structured developer analysis covering:
   - Goal (what is the objective?)
   - Included/Excluded audiences (who sees it, who doesn't?)
   - Pages/Location (where will it run?)
   - User Behavior (what actions matter?)
   - Tracking Requirements (what needs to be tracked?)
   - Missing Information (what details are not provided?)

3. Format your response as JSON with this structure:
{
  "goal": "Clear goal statement",
  "audiences": {
    "included": ["audience 1", "audience 2"],
    "excluded": ["exclusion 1", "exclusion 2"]
  },
  "location": {
    "pages": ["page description"],
    "geography": "geo info",
    "displayLogic": "how it shows"
  },
  "userBehavior": ["behavior 1", "behavior 2"],
  "tracking": {
    "newCookies": ["cookie 1", "cookie 2"],
    "goals": ["goal 1", "goal 2"],
    "variations": ["variation 1"]
  },
  "missingInfo": ["missing item 1", "missing item 2"],
  "openQuestions": ["question 1", "question 2"]
}

${helperFunctions ? `\nPredefined Helper Functions Available:\n${helperFunctions}\n` : ''}

TEST REQUIREMENTS:
${testRequirements}

Analyze this test and respond ONLY with valid JSON. Be thorough in identifying missing information.`;

                try {
                    let content = '';
                    if (apiProvider === API_PROVIDERS.ANTHROPIC) {
                        const response = await fetch('https://api.anthropic.com/v1/messages', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': apiKey,
                                'anthropic-version': '2023-06-01'
                            },
                            body: JSON.stringify({
                                model: 'claude-sonnet-4-20250514',
                                max_tokens: 4000,
                                messages: [{ role: 'user', content: prompt }]
                            })
                        });
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || response.status);
                        }
                        const data = await response.json();
                        content = data.content[0].text;
                    } else if (apiProvider === API_PROVIDERS.GEMINI) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { maxOutputTokens: 4000 }
                            })
                        });
                        if (!response.ok) {
                            const err = await response.json().catch(() => ({}));
                            throw new Error(err.error?.message || response.status);
                        }
                        const data = await response.json();
                        content = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    }

                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const analysisData = JSON.parse(jsonMatch[0]);
                        setAnalysis(analysisData);
                        setActiveTab('analysis');
                    } else {
                        setError('Failed to parse analysis. Please try again.');
                    }
                } catch (err) {
                    setError(`Analysis failed: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            // Generate code (Anthropic / Gemini / Demo template)
            const generateCode = async () => {
                const needsKey = apiProvider !== API_PROVIDERS.DEMO;
                if (needsKey && !apiKey) {
                    setError('Please add your API key in Settings, or use Demo mode for template only');
                    setActiveTab('settings');
                    return;
                }
                if (!analysis) {
                    setError('Please analyze the test first');
                    return;
                }

                setLoading(true);
                setError('');
                setGeneratedCode(null);

                if (apiProvider === API_PROVIDERS.DEMO) {
                    await new Promise(r => setTimeout(r, 400));
                    setGeneratedCode(`// Demo mode – template only. Use Anthropic or Gemini in Settings for full code generation.
// Analysis summary: ${analysis.goal.slice(0, 80)}...

(function() {
  // TODO: Add your targeting (audiences, exclusions)
  // TODO: Add cookie helpers if needed
  // TODO: Implement variation logic and DOM changes
  // TODO: Add click/view tracking and goals
  console.log('A/B test placeholder – fill using Analysis tab and your helpers');
})();
`);
                    setActiveTab('code');
                    setLoading(false);
                    return;
                }

                const prompt = `You are a Frontend Experimentation Developer. Generate complete, production-ready A/B test code.

STRICT RULES:
1. Use ONLY the predefined helper functions provided
2. DO NOT create new utility functions
3. DO NOT add try/catch unless explicitly in helpers
4. Follow the exact standards provided
5. Include clear comments
6. Make it copy-paste ready

${helperFunctions ? `\nPREDEFINED HELPERS:\n${helperFunctions}\n` : 'WARNING: No helper functions provided. Ask user to provide them first.\n'}

TEST ANALYSIS:
${JSON.stringify(analysis, null, 2)}

ORIGINAL REQUIREMENTS:
${testRequirements}

Generate complete code that:
- Sets up all required cookies
- Implements targeting logic (audiences, exclusions)
- Shows the flash sale bar with correct timing
- Handles click tracking and redirects
- Uses ONLY the provided helper functions
- Is fully commented and ready to deploy

If critical information is missing, generate code with TODO comments marking what needs to be filled in.

Respond with ONLY the JavaScript code, no explanations.`;

                try {
                    let code = '';
                    if (apiProvider === API_PROVIDERS.ANTHROPIC) {
                        const response = await fetch('https://api.anthropic.com/v1/messages', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-api-key': apiKey,
                                'anthropic-version': '2023-06-01'
                            },
                            body: JSON.stringify({
                                model: 'claude-sonnet-4-20250514',
                                max_tokens: 8000,
                                messages: [{ role: 'user', content: prompt }]
                            })
                        });
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            throw new Error(errorData.error?.message || response.status);
                        }
                        const data = await response.json();
                        code = data.content[0].text;
                    } else if (apiProvider === API_PROVIDERS.GEMINI) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { maxOutputTokens: 8000 }
                            })
                        });
                        if (!response.ok) {
                            const err = await response.json().catch(() => ({}));
                            throw new Error(err.error?.message || response.status);
                        }
                        const data = await response.json();
                        code = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    }
                    setGeneratedCode(code.trim());
                    setActiveTab('code');
                } catch (err) {
                    setError(`Code generation failed: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert('Copied to clipboard!');
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <div className="gradient-bg text-white py-6 px-4 shadow-lg">
                        <div className="max-w-6xl mx-auto">
                            <h1 className="text-3xl font-bold mb-2">⚡Test Analyzer</h1>
                            <p className="text-sm opacity-90">A/B Testing Tool - Analyze Requirements → Generate Code</p>
                        </div>
                    </div>

                    {/* Error Display */}
                    {error && (
                        <div className="max-w-6xl mx-auto mt-4 px-4">
                            <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded">
                                <p className="font-bold">Error</p>
                                <p>{error}</p>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="max-w-6xl mx-auto mt-6 px-4 pb-8">
                        {/* Tabs */}
                        <div className="flex space-x-2 border-b mb-6 overflow-x-auto">
                            <button
                                onClick={() => setActiveTab('settings')}
                                className={`px-6 py-3 font-semibold transition whitespace-nowrap ${
                                    activeTab === 'settings'
                                        ? 'border-b-4 border-purple-600 text-purple-600'
                                        : 'text-gray-600 hover:text-purple-600'
                                }`}
                            >
                                ⚙️ Settings {(apiKey || apiProvider === 'demo') && '✓'}
                            </button>
                            <button
                                onClick={() => setActiveTab('input')}
                                className={`px-6 py-3 font-semibold transition whitespace-nowrap ${
                                    activeTab === 'input'
                                        ? 'border-b-4 border-purple-600 text-purple-600'
                                        : 'text-gray-600 hover:text-purple-600'
                                }`}
                            >
                                📝 Input
                            </button>
                            <button
                                onClick={() => setActiveTab('helpers')}
                                className={`px-6 py-3 font-semibold transition whitespace-nowrap ${
                                    activeTab === 'helpers'
                                        ? 'border-b-4 border-purple-600 text-purple-600'
                                        : 'text-gray-600 hover:text-purple-600'
                                }`}
                            >
                                🛠️ Code Standard
                            </button>
                            <button
                                onClick={() => setActiveTab('analysis')}
                                className={`px-6 py-3 font-semibold transition whitespace-nowrap ${
                                    activeTab === 'analysis'
                                        ? 'border-b-4 border-purple-600 text-purple-600'
                                        : 'text-gray-600 hover:text-purple-600'
                                }`}
                                disabled={!analysis}
                            >
                                📊 Analysis {analysis && '✓'}
                            </button>
                            <button
                                onClick={() => setActiveTab('code')}
                                className={`px-6 py-3 font-semibold transition whitespace-nowrap ${
                                    activeTab === 'code'
                                        ? 'border-b-4 border-purple-600 text-purple-600'
                                        : 'text-gray-600 hover:text-purple-600'
                                }`}
                                disabled={!generatedCode}
                            >
                                💻 Code {generatedCode && '✓'}
                            </button>
                        </div>

                        {/* Tab Content */}
                        <div className="bg-white rounded-lg shadow-lg p-6">
                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-4">⚙️ API Settings</h2>

                                    <div className="mb-6">
                                        <label className="block font-semibold mb-2">Choose provider</label>
                                        <div className="flex flex-wrap gap-4">
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="radio" name="provider" checked={apiProvider === API_PROVIDERS.ANTHROPIC} onChange={() => setApiProvider(API_PROVIDERS.ANTHROPIC)} className="w-4 h-4" />
                                                <span>Anthropic (Claude)</span>
                                            </label>
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="radio" name="provider" checked={apiProvider === API_PROVIDERS.GEMINI} onChange={() => setApiProvider(API_PROVIDERS.GEMINI)} className="w-4 h-4" />
                                                <span>Google Gemini (free tier)</span>
                                            </label>
                                            <label className="flex items-center gap-2 cursor-pointer">
                                                <input type="radio" name="provider" checked={apiProvider === API_PROVIDERS.DEMO} onChange={() => setApiProvider(API_PROVIDERS.DEMO)} className="w-4 h-4" />
                                                <span>Demo – No API</span>
                                            </label>
                                        </div>
                                        {apiProvider === API_PROVIDERS.DEMO && (
                                            <p className="text-sm text-amber-700 mt-2">Basic analysis + template code only; no key needed.</p>
                                        )}
                                    </div>

                                    {apiProvider !== API_PROVIDERS.DEMO && (
                                        <>
                                            {!apiKey ? (
                                                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                                                    <p className="font-semibold text-yellow-800 mb-2">🔑 API Key Required</p>
                                                    <p className="text-sm text-yellow-700">
                                                        {apiProvider === API_PROVIDERS.GEMINI ? (
                                                            <>Free key: <a href="https://aistudio.google.com/apikey" target="_blank" className="underline font-semibold">Google AI Studio</a></>
                                                        ) : (
                                                            <>Anthropic: <a href="https://console.anthropic.com/" target="_blank" className="underline font-semibold">Get it here</a></>
                                                        )}
                                                    </p>
                                                </div>
                                            ) : (
                                                <div className="bg-green-50 border-l-4 border-green-400 p-4 mb-6">
                                                    <p className="font-semibold text-green-800 mb-2">✅ API Key Configured</p>
                                                    <p className="text-sm text-green-700">Ready to use!</p>
                                                </div>
                                            )}

                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block font-semibold mb-2">{apiProvider === API_PROVIDERS.GEMINI ? 'Google Gemini API Key' : 'Anthropic API Key'}</label>
                                                    <input
                                                        type="password"
                                                        value={apiKey}
                                                        onChange={(e) => setApiKey(e.target.value)}
                                                        placeholder={apiProvider === API_PROVIDERS.GEMINI ? 'AIza...' : 'sk-ant-api03-...'}
                                                        className="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none font-mono"
                                                    />
                                                    <p className="text-sm text-gray-500 mt-2">Stored only in your browser; used only for API calls.</p>
                                                </div>
                                                <div className="flex gap-4">
                                                    <button onClick={saveApiKey} disabled={!apiKey.trim()} className="bg-purple-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed">💾 Save</button>
                                                    {apiKey && <button onClick={clearApiKey} className="bg-red-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700">🗑️ Remove Key</button>}
                                                </div>
                                            </div>

                                            <div className="mt-8 p-4 bg-blue-50 border-l-4 border-blue-500 rounded">
                                                <p className="font-semibold mb-2">📖 How to get key:</p>
                                                {apiProvider === API_PROVIDERS.GEMINI ? (
                                                    <ol className="list-decimal list-inside space-y-1 text-sm">
                                                        <li>Go to <a href="https://aistudio.google.com/apikey" target="_blank" className="text-blue-600 underline">aistudio.google.com/apikey</a></li>
                                                        <li>Create / copy your API key (free tier available)</li>
                                                        <li>Paste above and click Save</li>
                                                    </ol>
                                                ) : (
                                                    <ol className="list-decimal list-inside space-y-1 text-sm">
                                                        <li>Go to <a href="https://console.anthropic.com/" target="_blank" className="text-blue-600 underline">console.anthropic.com</a></li>
                                                        <li>API Keys → Create Key → paste above and Save</li>
                                                    </ol>
                                                )}
                                            </div>
                                        </>
                                    )}

                                    {apiProvider === API_PROVIDERS.DEMO && (
                                        <div className="flex gap-4">
                                            <button onClick={saveApiKey} className="bg-purple-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-purple-700">💾 Save Demo Mode</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* INPUT TAB */}
                            {activeTab === 'input' && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-4">Test Requirements</h2>
                                    <p className="text-gray-600 mb-4">
                                        Paste your test transcript, requirements, or brief below. Can be audio transcript, document, or plain text.
                                    </p>
                                    <textarea
                                        value={testRequirements}
                                        onChange={(e) => setTestRequirements(e.target.value)}
                                        placeholder="Paste your test requirements here... (e.g., transcript, test brief, user story)"
                                        className="w-full h-96 p-4 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none font-mono text-sm"
                                    />
                                    <div className="mt-4 flex gap-4">
                                        <button
                                            onClick={analyzeTest}
                                            disabled={loading || !testRequirements.trim()}
                                            className="bg-purple-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2"
                                        >
                                            {loading && <div className="spinner"></div>}
                                            {loading ? 'Analyzing...' : '🔍 Analyze Test'}
                                        </button>
                                        <button
                                            onClick={() => setTestRequirements('')}
                                            className="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300"
                                        >
                                            Clear
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* HELPERS TAB */}
                            {activeTab === 'helpers' && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-4">Predefined Helper Functions</h2>
                                    <p className="text-gray-600 mb-4">
                                        Paste your standard helper functions, utilities, and coding standards. This will be saved locally and used for code generation.
                                    </p>
                                    <textarea
                                        value={helperFunctions}
                                        onChange={(e) => setHelperFunctions(e.target.value)}
                                        placeholder={`Example:
// Cookie Helpers
function setCookie(name, value, days) { ... }
function getCookie(name) { ... }

// DOM Helpers
function waitForElement(selector, callback) { ... }
function $observeSelector(selector, callback) { ... }

// Targeting Helpers
function isLoggedIn() { ... }
function getUserSegment() { ... }`}
                                        className="w-full h-96 p-4 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none font-mono text-sm"
                                    />
                                    <div className="mt-4 flex gap-4">
                                        <button
                                            onClick={saveHelpers}
                                            className="bg-green-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-green-700"
                                        >
                                            💾 Save Helpers
                                        </button>
                                        <button
                                            onClick={() => {
                                                if (confirm('Clear all saved helper functions?')) {
                                                    setHelperFunctions('');
                                                    localStorage.removeItem('helperFunctions');
                                                }
                                            }}
                                            className="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300"
                                        >
                                            Clear
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* ANALYSIS TAB */}
                            {activeTab === 'analysis' && analysis && (
                                <div>
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold">Test Analysis</h2>
                                        <button
                                            onClick={generateCode}
                                            disabled={loading}
                                            className="bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:bg-gray-400 flex items-center gap-2"
                                        >
                                            {loading && <div className="spinner"></div>}
                                            {loading ? 'Generating...' : '💻 Generate Code'}
                                        </button>
                                    </div>

                                    {/* Goal */}
                                    <div className="analysis-section">
                                        <h3 className="text-xl font-bold mb-2">🎯 Goal</h3>
                                        <p className="text-gray-700">{analysis.goal}</p>
                                    </div>

                                    {/* Audiences */}
                                    <div className="analysis-section">
                                        <h3 className="text-xl font-bold mb-2">👥 Audiences</h3>
                                        <div className="grid md:grid-cols-2 gap-4">
                                            <div>
                                                <h4 className="font-semibold text-green-700 mb-2">✓ Included:</h4>
                                                <ul className="list-disc list-inside space-y-1">
                                                    {analysis.audiences.included.map((item, idx) => (
                                                        <li key={idx} className="text-gray-700">{item}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                            <div>
                                                <h4 className="font-semibold text-red-700 mb-2">✗ Excluded:</h4>
                                                <ul className="list-disc list-inside space-y-1">
                                                    {analysis.audiences.excluded.map((item, idx) => (
                                                        <li key={idx} className="text-gray-700">{item}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Location */}
                                    <div className="analysis-section">
                                        <h3 className="text-xl font-bold mb-2">📍 Location & Display</h3>
                                        <div className="space-y-2">
                                            <p><strong>Pages:</strong> {analysis.location.pages.join(', ')}</p>
                                            <p><strong>Geography:</strong> {analysis.location.geography}</p>
                                            <p><strong>Display Logic:</strong> {analysis.location.displayLogic}</p>
                                        </div>
                                    </div>

                                    {/* User Behavior */}
                                    <div className="analysis-section">
                                        <h3 className="text-xl font-bold mb-2">🧑‍💻 User Behavior Tracking</h3>
                                        <ul className="list-disc list-inside space-y-1">
                                            {analysis.userBehavior.map((item, idx) => (
                                                <li key={idx} className="text-gray-700">{item}</li>
                                            ))}
                                        </ul>
                                    </div>

                                    {/* Tracking */}
                                    <div className="analysis-section">
                                        <h3 className="text-xl font-bold mb-2">📊 Tracking Requirements</h3>
                                        <div className="space-y-3">
                                            {analysis.tracking.newCookies.length > 0 && (
                                                <div>
                                                    <h4 className="font-semibold mb-1">New Cookies to Implement:</h4>
                                                    <ul className="list-disc list-inside">
                                                        {analysis.tracking.newCookies.map((item, idx) => (
                                                            <li key={idx} className="text-gray-700">{item}</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                            <div>
                                                <h4 className="font-semibold mb-1">Goals:</h4>
                                                <ul className="list-disc list-inside">
                                                    {analysis.tracking.goals.map((item, idx) => (
                                                        <li key={idx} className="text-gray-700">{item}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                            {analysis.tracking.variations.length > 0 && (
                                                <div>
                                                    <h4 className="font-semibold mb-1">Variations:</h4>
                                                    <ul className="list-disc list-inside">
                                                        {analysis.tracking.variations.map((item, idx) => (
                                                            <li key={idx} className="text-gray-700">{item}</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Missing Info */}
                                    {analysis.missingInfo.length > 0 && (
                                        <div className="missing-info rounded">
                                            <h3 className="text-xl font-bold mb-2">⚠️ Missing Information</h3>
                                            <ul className="list-disc list-inside space-y-1">
                                                {analysis.missingInfo.map((item, idx) => (
                                                    <li key={idx} className="text-gray-800">{item}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}

                                    {/* Open Questions */}
                                    {analysis.openQuestions.length > 0 && (
                                        <div className="analysis-section">
                                            <h3 className="text-xl font-bold mb-2">❓ Open Questions</h3>
                                            <ul className="list-disc list-inside space-y-1">
                                                {analysis.openQuestions.map((item, idx) => (
                                                    <li key={idx} className="text-gray-700">{item}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* CODE TAB */}
                            {activeTab === 'code' && generatedCode && (
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold">Generated Code</h2>
                                        <button
                                            onClick={() => copyToClipboard(generatedCode)}
                                            className="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700"
                                        >
                                            📋 Copy Code
                                        </button>
                                    </div>
                                    <div className="code-block">
                                        <pre>{generatedCode}</pre>
                                    </div>
                                    <div className="mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 rounded">
                                        <p className="font-semibold mb-2">📝 Next Steps:</p>
                                        <ol className="list-decimal list-inside space-y-1 text-sm">
                                            <li>Review the code for any TODO comments</li>
                                            <li>Fill in missing URLs, selectors, or copy text</li>
                                            <li>Test in development environment</li>
                                            <li>Verify all helper functions are available</li>
                                            <li>Deploy to your A/B testing platform</li>
                                        </ol>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Instructions */}
                        <div className="mt-6 bg-gray-100 rounded-lg p-6">
                            <h3 className="font-bold text-lg mb-3">📖 How to Use This Tool</h3>
                            <ol className="list-decimal list-inside space-y-2 text-sm text-gray-700">
                                <li><strong>Settings:</strong> Choose Anthropic, Google Gemini (free), or Demo (no API). Add API key if not using Demo.</li>
                                <li><strong>Add Code Standard</strong> Go to "Helper Functions" tab and paste your predefined utilities (optional but recommended)</li>
                                <li><strong>Paste Requirements:</strong> In "Input" tab, paste your test transcript, brief, or requirements</li>
                                <li><strong>Analyze:</strong> Click "Analyze Test" - AI will extract key information and identify gaps</li>
                                <li><strong>Review Analysis:</strong> Check the "Analysis" tab for structured breakdown</li>
                                <li><strong>Generate Code:</strong> Click "Generate Code" button - uses your helpers to create production-ready code</li>
                                <li><strong>Copy & Deploy:</strong> Copy the code and deploy to your A/B testing platform</li>
                            </ol>
                            <p className="mt-4 text-xs text-gray-600">
                                🔒 <strong>Privacy:</strong> Your API key is stored only in your browser's localStorage. It never leaves your computer except when making API calls to Anthropic.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
