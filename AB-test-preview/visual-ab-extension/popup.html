<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Trigger</title>
  <style>
    body {
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      width:200px;
      height:100px;
      font-family:Arial,sans-serif;
    }
    button {
      padding:6px 12px;
      cursor:pointer;
      background:#007bff;
      color:white;
      border:none;
      border-radius:4px;
    }

      background:#0056b3;
    }
  </style>
</head>
<body>
  <button id="openModal">Open Preview Popup</button>

  <script src="popup.js"></script>
</body>
</html>
